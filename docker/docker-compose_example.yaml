services:
  web:
    image: medtrack:latest
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: "changme"
      MONGO_USERNAME: "changme"
      MONGO_PASSWORD: "changme"
      MONGO_HOST: "mongodb"
      MONGO_PORT: "27017"
      MONGO_DB: "changme"
      STOCK_WARNING_TRESHOLD: "5"
      MAIL_SERVER: "smtp.gmail.com"
      MAIL_PORT: "587"
      MAIL_USE_TLS: "True"
      MAIL_USERNAME: "changme"
      MAIL_PASSWORD: "changme"
      MAIL_DEFAULT_SENDER: "changme"
      ENABLE_MEDICINE_CHECKER: "True"
      MEDICINE_CHECK_INTERVAL: "3"
      LOG_TYPE: "STDOUT"
      LOG_DIR: "logs"
      LOG_FILE: "app.log"
      LOG_MAX_BYTES: "10240"
      LOG_BACKUP_COUNT: "5"
    depends_on:
      - mongodb
  
  mongodb:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: "changme"
      MONGO_INITDB_ROOT_PASSWORD: "changme"
      MONGO_INITDB_DATABASE: "medapp"
    ports:
      - "27017:27017"
    volumes:
      - ./docker/volumes/mongodb_data:/data/db
      - ./docker/components/mongo/init-mongo.sh:/tmp/init-mongo.sh:ro
    command: ["/bin/bash", "/tmp/init-mongo.sh", "docker-entrypoint.sh", "mongod"]